name: CI

# Run on every push and every pull request so each change is checked
# automatically. `concurrency` cancels superseded runs on the same ref.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the project's supported Node (see .nvmrc / package.json engines).
          node-version-file: .nvmrc
          cache: npm

      # Clean, reproducible install from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Mirrors `make check` (lint + typecheck + build); a broken build gates merges.
      - name: Build
        run: npm run build
