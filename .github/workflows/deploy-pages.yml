name: Deploy to GitHub Pages

# Deploy path for ALD-4 — proves end-to-end deploy of the hello-world slice.
# Builds a static export of the Next.js app and publishes it to GitHub Pages.
# Triggers on every push to main, and on-demand via the Actions "Run workflow"
# button (workflow_dispatch). See README "Deploy" + docs/adr/0002-deploy-target.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped to what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        id: pages
        # Outputs base_path (e.g. "/ald-web") for project-site subpath hosting.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # GA4 go-live (ALD-38): the analytics sink is inlined at build time
          # (NEXT_PUBLIC_* are baked into the static export by Next). It stays a
          # no-op until this repo variable holds a real measurement id — unset
          # resolves to "" and `track()` no-ops, so deploys are safe before
          # go-live. Flip analytics on with a single, secret-free change:
          #   gh variable set NEXT_PUBLIC_GA_MEASUREMENT_ID -R nch3ng/ald-web -b 'G-XXXXXXXXXX'
          # then re-run this workflow. A GA4 measurement id is a public client-side
          # id (it ships in page JS), so a repo *variable* — not a secret — is correct.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Disable Jekyll (serve Next's _next/ dir as-is)
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
